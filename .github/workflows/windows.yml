name: Windows-programma bouwen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Versie bepalen
        id: version
        shell: pwsh
        run: |
          $v = python -c "import mijnarchief; print(mijnarchief.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Programma bouwen (MijnArchief.exe)
        run: >
          pyinstaller --noconfirm --clean --windowed --name MijnArchief
          --icon assets/icon.ico --exclude-module tkinter main.py

      - name: Installatieprogramma bouwen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss

      - name: Losse versie (zonder installatie) inpakken
        shell: pwsh
        run: Compress-Archive -Path dist\MijnArchief -DestinationPath Output\MijnArchief-zonder-installatie.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mijn-Archief-Windows
          path: |
            Output/MijnArchief-Setup-*.exe
            Output/MijnArchief-zonder-installatie.zip

      - name: Release maken (alleen bij een versie-tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/MijnArchief-Setup-*.exe
            Output/MijnArchief-zonder-installatie.zip
